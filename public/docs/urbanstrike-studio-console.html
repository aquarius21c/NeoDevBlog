<style>
/* Layout: 상단 상태 띠(단계·게이트·스프린트) + 탭 7개. 사격장 표지판처럼 굵은 표제, 나머지는 조용한 작업 화면. */
:root{
  --bg:#eef0ec; --panel:#fbfbf8; --sunk:#e3e6e0; --fg:#1b201d; --muted:#5b6560; --line:#cdd3cc;
  --accent:#c2541b; --accent-ink:#ffffff; --steel:#2f4a5a;
  --ok:#2f7a4c; --warn:#9a6a00; --bad:#b0281f; --idle:#69737a; --info:#2f5f8a;
  --ok-bg:#dcefe2; --warn-bg:#f6ebcd; --bad-bg:#f7dcd9; --idle-bg:#e5e8ea; --info-bg:#dce8f3;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Gothic A1","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a1f1c; --sunk:#232925; --fg:#e4e8e5; --muted:#98a39d; --line:#303833;
  --accent:#e8834a; --accent-ink:#1a1f1c; --steel:#8fb3c7;
  --ok:#6fc591; --warn:#e2b54b; --bad:#f08a80; --idle:#9ba6ad; --info:#86b6e0;
  --ok-bg:#1c3426; --warn-bg:#382d12; --bad-bg:#3c1d1a; --idle-bg:#252b2f; --info-bg:#1b2c3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a1f1c; --sunk:#232925; --fg:#e4e8e5; --muted:#98a39d; --line:#303833;
  --accent:#e8834a; --accent-ink:#1a1f1c; --steel:#8fb3c7;
  --ok:#6fc591; --warn:#e2b54b; --bad:#f08a80; --idle:#9ba6ad; --info:#86b6e0;
  --ok-bg:#1c3426; --warn-bg:#382d12; --bad-bg:#3c1d1a; --idle-bg:#252b2f; --info-bg:#1b2c3c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14.5px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
h2{font-size:1.05rem;margin:0;text-wrap:balance}
h3{font-size:.95rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.statusbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.statusbar>div{background:var(--panel);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.statusbar b{font-family:var(--mono);font-size:1.05rem;font-weight:500}
.statusbar small{color:var(--muted);font-size:.75rem}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);color:var(--fg);border-radius:6px;padding:10px 14px;border-left:4px solid var(--bad)}
.alert b{color:var(--bad)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav button:focus-visible,.chipbtn:focus-visible,a:focus-visible{outline:2px solid var(--info);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pill{display:inline-block;font-size:.72rem;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap}
.s-done,.s-pass,.s-fixed,.s-closed{background:var(--ok-bg);color:var(--ok)}
.s-review{background:var(--info-bg);color:var(--info)}
.s-doing{background:var(--warn-bg);color:var(--warn)}
.s-fail,.s-open{background:var(--bad-bg);color:var(--bad)}
.s-todo,.s-wait,.s-hold{background:var(--idle-bg);color:var(--idle)}
/* stage track */
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.stg{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stg .c{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.stg .n{font-weight:700;font-size:.88rem;word-break:keep-all}
.stg .g{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.stg.past{background:var(--sunk)}
.stg.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stg.now .c{color:var(--accent)}
.stg[aria-pressed="true"]{outline:2px solid var(--steel)}
@media (max-width:760px){.track{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.track{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* tests */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .num{font-family:var(--display);font-weight:900;font-size:1.4rem;line-height:1;color:var(--muted);text-align:right}
.step.pass .num{color:var(--ok)} .step.fail .num{color:var(--bad)} .step.hold .num{opacity:.5} .step.doing .num{color:var(--warn)}
.step .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.step .who{font-size:.78rem;color:var(--muted)}
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.meter i{display:block;height:100%}
/* board */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipbtn{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:2px 10px;cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--bg)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kanban{grid-template-columns:1fr}}
.col{background:var(--sunk);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{display:flex;justify-content:space-between;font-size:.85rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.card .top{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.card .t{font-size:.86rem;word-break:keep-all;overflow-wrap:anywhere}
.empty{font-size:.8rem;color:var(--muted);padding:4px 2px}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lead{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.lead .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lead .code{font-family:var(--display);font-weight:900;font-size:1.15rem;color:var(--steel)}
.lead ul{margin:0;padding-left:1.1em;font-size:.84rem}
.lead .meta{font-size:.76rem;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:6px;border-radius:2px;background:var(--sunk)}
.dots i.on{background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.76rem;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.skill{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.skill:last-child{border-bottom:0}
.skill code{font-family:var(--mono);font-size:.85rem;font-weight:500;white-space:nowrap}
.skill div{min-width:0}
.links{display:flex;flex-direction:column;gap:6px}
.links a{color:var(--info);text-decoration:none}
.links a:hover{text-decoration:underline}
footer{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card,.stg{transition:border-color .15s}}
</style>

let ownerF = 'ALL';
const COLS = [['todo','할 일'],['doing','진행'],['review','검토'],['done','완료']];
function renderBoard(){
  const owners = ['ALL',...new Set(D.board.map(b=>b.owner))];
  const list = D.board.filter(b=>ownerF==='ALL'||b.owner===ownerF);
  $('#v-board').innerHTML = `<div class="filters"><span class="muted" style="font-size:.8rem">담당</span>${owners.map(o=>`<button class="chipbtn" aria-pressed="${o===ownerF}" data-o="${o}">${o==='ALL'?'전체':o}</button>`).join('')}</div>
  <div class="kanban">${COLS.map(([s,l])=>{const items=list.filter(b=>b.st===s);return `<div class="col"><h3><span>${l}</span><span class="mono muted">${items.length}</span></h3>${items.map(b=>`<div class="card"><div class="top"><span>${b.id}</span><span>${b.owner}${b.when?' · '+b.when:''}</span></div><div class="t">${esc(b.title)}</div></div>`).join('')||'<div class="empty">없음</div>'}</div>`}).join('')}</div>
  <div class="panel"><h2 style="margin-bottom:8px">버그</h2><div class="tbl"><table><thead><tr><th>번호</th><th>내용</th><th>상태</th></tr></thead><tbody>${D.bugs.map(b=>`<tr><td class="mono">${b.id}</td><td>${esc(b.title)}</td><td>${pill(b.st)}</td></tr>`).join('')}</tbody></table></div></div>`;
  document.querySelectorAll('.chipbtn[data-o]').forEach(b=>b.addEventListener('click',()=>{ownerF=b.dataset.o;renderBoard();}));
}
